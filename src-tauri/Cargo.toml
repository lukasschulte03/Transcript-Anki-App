[package]
name = "lectio"
version = "0.4.11"
description = "En local-first föreläsningsassistent med Anki-integration"
authors = ["Lectio contributors"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "lectio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
keyring = { version = "3", features = ["windows-native"] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# Avoid Tauri's optional common-controls-v6 feature. Its static
# TaskDialogIndirect import prevents the process from starting on Windows
# installations that expose the legacy comctl32 loader surface.
tauri = { version = "2.11.3", default-features = false, features = ["wry", "compression", "dynamic-acl"] }
tauri-plugin-log = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "net", "process", "sync", "time"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
keyring = { version = "3", features = ["windows-native"] }
base64 = "0.22"
rand = "0.9"
sha2 = "0.10"
url = "2"
tauri-plugin-wdio = { version = "1.4.0", optional = true }

[features]
tauri-plugin-wdio = ["dep:tauri-plugin-wdio"]
